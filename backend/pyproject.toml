[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rtr4-learning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "portalocker>=3,<4",
    "pydantic>=2",
    "pypdf",
    "pypdfium2",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
